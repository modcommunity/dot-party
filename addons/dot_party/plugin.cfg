[plugin]

name="dot-party"
description="Parties that play together, integrated with the TMC backbone's party system: the backbone's party model read as-is, a client that polls, heartbeats, diffs snapshots into events and follows its party to a server, a game server that tracks parties and reports rosters, rounds and scores, and reservations the server actually enforces — private bookings admit only the party, public ones hold seats while it arrives. Plus the same rules in-process for a LAN. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_party_plugin.gd"
